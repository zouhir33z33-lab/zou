name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android scaffolding (dz.eps.assistant.eps_assistant)
        run: |
          mkdir /tmp/bak && cp -r lib test pubspec.yaml analysis_options.yaml /tmp/bak/
          flutter create --platforms=android --org dz.eps.assistant --project-name eps_assistant .
          rm -rf lib test && cp -r /tmp/bak/lib /tmp/bak/test . && cp /tmp/bak/pubspec.yaml /tmp/bak/analysis_options.yaml .
      - name: Patch Android manifest
        run: bash scripts/patch_android.sh
      - run: flutter pub get
      - run: dart run flutter_launcher_icons
      - run: flutter analyze
        continue-on-error: true
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: EPS_Assistant_apk
          path: build/app/outputs/flutter-apk/app-release.apk
