name: eps_assistant
description: EPS Assistant - assistant du professeur d'éducation physique et sportive.
publish_to: 'none'
version: 1.2.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.5.1
  sqflite: ^2.3.3
  path: ^1.9.0
  path_provider: ^2.1.3
  shared_preferences: ^2.2.3
  intl: any
  pdf: ^3.11.0
  printing: ^5.12.0
  arabic_reshaper: ^1.0.0
  excel: ^4.0.3
  csv: ^6.0.0
  archive: ^3.6.1
  file_picker: ^8.0.6
  share_plus: ^9.0.0
  url_launcher: ^6.3.0
  device_info_plus: ^10.1.0
  crypto: ^3.0.3
  uuid: ^4.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/images/app_logo.png

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
  fonts:
    - family: Arial
      fonts:
        - asset: assets/fonts/arial.ttf
        - asset: assets/fonts/arialbd.ttf
          weight: 700
